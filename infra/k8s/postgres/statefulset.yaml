# StatefulSet, not Deployment: Postgres needs a stable identity and its own
# persistent storage that survives the pod being rescheduled - a Deployment's pods
# are interchangeable by design (any replica can be killed/replaced freely, sharing
# storage isn't guaranteed), which is wrong for a database. volumeClaimTemplates
# gives each replica (just one, here) its own PersistentVolumeClaim, created
# automatically and kept stable across restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fitness-coach
spec:
  serviceName: postgres  # must match the headless Service in service.yaml
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fitness"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fitness"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
