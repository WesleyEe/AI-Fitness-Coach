# Plain YAML Secrets are base64-encoded, NOT encrypted - anyone who can `kubectl get
# secret -o yaml` or read this file sees the plaintext. Fine for a local learning
# cluster; a real deployment would use something like Sealed Secrets, External
# Secrets Operator, or a cloud provider's secret manager instead of committing this
# file as-is (see GITOPS.md's "secrets" note).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fitness-coach
type: Opaque
stringData:
  POSTGRES_USER: fitness
  POSTGRES_PASSWORD: fitness
  POSTGRES_DB: fitness_coach
