# The password here duplicates postgres/secret.yaml's POSTGRES_PASSWORD rather than
# referencing it - Kubernetes has no built-in way to compose one Secret's value into
# another's at the manifest level. A more sophisticated setup would generate this
# from a single source (e.g. a Helm template reading one value into both places -
# see infra/helm's version of this), but for raw manifests, keeping them in sync by
# hand is the honest trade-off being made here.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: fitness-coach
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://fitness:fitness@postgres:5432/fitness_coach"
