# Unlike the raw-manifest version (infra/k8s/backend/secret.yaml), this DATABASE_URL
# is templated directly from .Values.postgres.* - one source of truth for the
# password instead of two files that have to be kept in sync by hand.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fitness-coach.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
