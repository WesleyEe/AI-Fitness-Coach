server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file serves index.html,
    # so client-side routing (if this app ever adds any) works on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
